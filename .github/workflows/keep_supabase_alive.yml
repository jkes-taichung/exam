name: Keep Supabase Alive

on:
  schedule:
    # 每 3 天在 UTC 00:00 (台灣時間 08:00) 自動觸發執行
    - cron: '0 0 */3 * *'
  # 支援在 GitHub Actions 頁面手動點擊按鈕觸發測試
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://ltkvavtvwyrholntnzik.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0a3ZhdnR2d3lyaG9sbnRuemlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzIxMjEsImV4cCI6MjA5NjQwODEyMX0.Hy_1daIKEsL_-r1EPmc2fONBTRpyQg8he95vmnboS5E}"

          # 發送請求至 Supabase API
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "Supabase HTTP 回傳狀態碼: $RESPONSE_CODE"

          # 只要伺服器有回應（狀態碼不是 000 連線失敗），即代表 API 請求已成功抵達
          if [ "$RESPONSE_CODE" -ne "000" ]; then
            echo "SUCCESS: Supabase 伺服器回應狀態碼 $RESPONSE_CODE，專案成功維持活躍！"
          else
            echo "ERROR: 無法連線至 Supabase 伺服器，請檢查 URL 設定。"
            exit 1
          fi

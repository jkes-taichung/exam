name: Keep Supabase Alive

on:
  schedule:
    # 每 3 天在 UTC 00:00 (台灣時間上午 08:00) 自動觸發執行
    - cron: '0 0 */3 * *'
  # 支援在 GitHub Actions 頁面手動點擊按鈕觸發測試
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Storage Public File
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          URL="${SUPABASE_URL:-https://ltkvavtvwyrholntnzik.supabase.co}"

          # 直接讀取 exam bucket 中的 301_1782094570849.mp3 公開檔案
          TARGET_URL="${URL}/storage/v1/object/public/exam/301_1782094570849.mp3"

          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${TARGET_URL}")

          echo "請求目標檔案: ${TARGET_URL}"
          echo "Supabase HTTP 回傳狀態碼: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "SUCCESS: 成功讀取 Supabase 公開音訊檔，專案狀態保持活躍！"
          elif [ "$RESPONSE_CODE" -ne "000" ]; then
            echo "SUCCESS: 伺服器已回應（狀態碼 $RESPONSE_CODE），專案維持活躍！"
          else
            echo "ERROR: 無法連線至 Supabase 伺服器。"
            exit 1
          fi
